<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그림 라이어 게임</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2ff;color:#263450;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1000px;margin:auto;padding:16px}h1{margin-bottom:4px}.card{background:white;border-radius:20px;padding:20px;margin:15px 0;box-shadow:0 4px 18px #aebce744}button,input,select{font:inherit;padding:12px;border-radius:12px}button{border:0;background:#425cd0;color:white;cursor:pointer}button:disabled{opacity:.45}input,select{border:1px solid #b9c5df;max-width:100%}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.hidden{display:none}.muted{color:#65738c}.notice{font-weight:650;color:#425cd0}canvas{width:100%;height:auto;background:#fff;border:2px solid #bbc7e3;border-radius:12px;touch-action:none}#clock{font-size:28px;font-weight:800;color:#e24a61}.drawing-card{padding:10px;border:1px solid #d4ddef;border-radius:12px}.drawing-card canvas{border:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.vote-btn{margin:4px}#teacher{border-top:1px solid #d7def1;padding-top:14px;margin-top:14px}
</style></head><body><main><h1>🎨 그림 라이어 게임</h1><p class="muted">학생 17명까지 · 익명 이어 그리기 / 각자 그리기</p>
<section id="entry" class="card"><h2>게임방 입장</h2><div class="row"><input id="roomInput" maxlength="6" placeholder="6자리 게임방 코드"><input id="nameInput" maxlength="25" placeholder="학생 이름"><button id="join">학생 입장</button><button id="create">교사: 새 게임방</button></div></section>
<section id="room" class="card hidden"><h2>게임방 <span id="code"></span></h2><p id="status" class="notice"></p><p>참여 학생: <b id="count">0</b> / 17</p><div id="teacher" class="hidden"><div class="row"><select id="mode"><option value="chain">이어 그리기 (1인 10초)</option><option value="solo">각자 그리기</option></select><input id="word" placeholder="제시어"><button id="start">게임 시작</button><button id="next">다음 차례</button><button id="reveal">라이어 공개</button></div><p class="muted">이어 그리기: 10초마다 '다음 차례'를 눌러 주세요. 각자 그리기: 충분한 시간이 지난 후 '다음 차례'로 투표를 시작하세요.</p></div>
<div id="game" class="hidden"><div class="row"><b id="phase"></b><span id="clock"></span><span id="hint" class="notice"></span></div><div id="drawingArea"><canvas id="board" width="900" height="540"></canvas><div class="row"><button data-color="#263450">검정</button><button data-color="#e94460">빨강</button><button data-color="#2485e8">파랑</button><button data-color="#ffffff">지우개</button><label>굵기 <input id="size" type="range" min="2" max="30" value="6"></label></div></div><div id="gallery" class="grid"></div><div id="votes"></div></div></section>
<p class="muted">수업용 초기 버전입니다. 학생 이름은 투표 명단에는 표시되지만 이어 그리기 차례는 공개되지 않습니다. 게임방 코드는 수업 참여자에게만 알려주세요.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<script>
const db=supabase.createClient('https://ocaxrntorjmotzxxqjta.supabase.co','sb_publishable_AHwYe9OgzUChbajp1UYjXg_auB6VP-p');
const $=id=>document.getElementById(id);let code='',token='',host=false,me='',state=null,channel=null,painting=false,points=[],color='#263450',busy=false;const cv=$('board'),ctx=cv.getContext('2d');
async function rpc(name,args){let {data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function act(action,data={}){return rpc('liar_action',{p_action:action,p_code:code,p_token:token,p_data:data})}
function fail(e){alert(e.message||String(e))}
async function enter(){ $('entry').classList.add('hidden');$('room').classList.remove('hidden');$('code').textContent=code;$('teacher').classList.toggle('hidden',!host);channel=db.channel('draw-'+code).on('broadcast',{event:'change'},()=>refresh()).subscribe();await refresh();setInterval(refresh,1100)}
async function announce(){if(channel)await channel.send({type:'broadcast',event:'change',payload:{}})}
$('create').onclick=async()=>{try{const d=await rpc('liar_action',{p_action:'create'});code=d.code;token=d.token;host=true;await enter()}catch(e){fail(e)}};
$('join').onclick=async()=>{try{code=$('roomInput').value.trim().toUpperCase();const name=$('nameInput').value.trim();if(!code||!name)return alert('게임방 코드와 이름을 입력하세요.');const d=await rpc('liar_join',{p_code:code,p_name:name});token=d.token;me=d.id;await enter();await announce()}catch(e){fail(e)}};
$('start').onclick=async()=>{try{if(!$('word').value.trim())return alert('제시어를 입력해 주세요.');await act('start',{mode:$('mode').value,word:$('word').value.trim()});await announce();await refresh()}catch(e){fail(e)}};
$('next').onclick=async()=>{try{await act('next');await announce();await refresh()}catch(e){fail(e)}};
$('reveal').onclick=async()=>{try{await act('reveal');await announce();await refresh()}catch(e){fail(e)}};
async function refresh(){if(busy)return;busy=true;try{state=await act('state');render()}catch(e){$('status').textContent='연결 오류: '+e.message}finally{busy=false}}
function paint(canvas,strokes){const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);c.fillStyle='white';c.fillRect(0,0,canvas.width,canvas.height);for(const s of strokes){const ps=s.points;if(!Array.isArray(ps)||!ps.length)continue;c.beginPath();c.lineCap='round';c.lineJoin='round';c.strokeStyle=ps[0].c||'#263450';c.lineWidth=ps[0].w||5;c.moveTo(ps[0].x,ps[0].y);for(const p of ps.slice(1))c.lineTo(p.x,p.y);if(ps.length===1)c.lineTo(ps[0].x+.1,ps[0].y+.1);c.stroke()}}
function render(){if(!state)return;$('count').textContent=state.count;$('game').classList.toggle('hidden',state.phase==='lobby');$('status').textContent=state.phase==='lobby'?'학생들이 입장 중입니다.':state.phase==='draw'?'그림을 그리는 중입니다.':state.phase==='vote'?'라이어에게 투표해 주세요.':'라이어 공개!';if(state.phase==='lobby')return;
$('phase').textContent=state.mode==='chain'?'이어 그리기':'각자 그리기';const time=Math.max(0,Math.ceil((new Date(state.turn_ends_at)-Date.now())/1000));$('clock').textContent=state.phase==='draw'&&state.mode==='chain'?time+'초':'';
let can=state.phase==='draw'&&!host&&state.my_turn&&(state.mode==='solo'||time>0);$('hint').textContent=state.phase==='draw'?(host?'교사 진행 화면':can?'내 차례 · '+(state.word?'제시어: '+state.word:'당신은 라이어입니다!'):'다른 학생이 그리고 있습니다.') :'';cv.style.pointerEvents=can?'auto':'none';
const showGallery=state.mode==='solo'&&state.phase!=='draw';$('drawingArea').classList.toggle('hidden',showGallery);$('gallery').classList.toggle('hidden',!showGallery);
if(!painting){const ss=state.mode==='solo'&&state.phase==='draw'?state.strokes.filter(s=>s.player_id===me):state.strokes;paint(cv,ss)}
if(showGallery){$('gallery').replaceChildren();state.players.forEach((p,i)=>{const box=document.createElement('div');box.className='drawing-card';const label=document.createElement('b');label.textContent='그림 '+(i+1);const c=document.createElement('canvas');c.width=900;c.height=540;box.append(label,c);$('gallery').append(box);paint(c,state.strokes.filter(s=>s.player_id===p.id))})}
$('votes').replaceChildren();if(state.phase==='vote'){const p=document.createElement('p');p.textContent='라이어라고 생각하는 학생을 선택하세요.';$('votes').append(p);if(!host)state.players.forEach(x=>{const b=document.createElement('button');b.className='vote-btn';b.textContent=x.name;b.onclick=async()=>{try{await act('vote',{target:x.id});$('votes').textContent='투표가 저장되었습니다.'}catch(e){fail(e)}};$('votes').append(b)})}
if(state.phase==='result'){const p=state.players.find(x=>x.id===state.liar);$('votes').textContent='라이어: '+(p?.name||'알 수 없음')+' / 제시어: '+(state.word||'공개되지 않음')}
}
function position(e){const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*cv.width/r.width),y:Math.round((e.clientY-r.top)*cv.height/r.height),c:color,w:Number($('size').value)}}
cv.onpointerdown=e=>{if(cv.style.pointerEvents==='none')return;e.preventDefault();painting=true;points=[position(e)];cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{if(!painting)return;e.preventDefault();let p=position(e),a=points[points.length-1];points.push(p);ctx.beginPath();ctx.lineCap='round';ctx.strokeStyle=color;ctx.lineWidth=p.w;ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke()};
cv.onpointerup=async()=>{if(!painting)return;painting=false;if(points.length===1)points.push({...points[0],x:points[0].x+.1});try{for(let i=0;i<points.length;i+=190)await act('stroke',{points:points.slice(i,i+190)});await announce()}catch(e){fail(e)}points=[]};
document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>color=b.dataset.color);
</script></body></html>
