<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>그림 라이어 게임</title><style>
*{box-sizing:border-box}body{margin:0;background:#f0f5ff;color:#223456;font-family:system-ui,'Malgun Gothic',sans-serif}main{max-width:1350px;margin:auto;padding:18px}.card{background:white;border:1px solid #dce6fb;border-radius:22px;padding:20px;margin:15px 0;box-shadow:0 6px 22px #a8bfe82e}h1{margin:0}button,input,select{font:inherit;border-radius:12px;padding:11px}button{background:#4673df;border:0;color:white;cursor:pointer}button:disabled{opacity:.4}input,select{border:1px solid #b8c9e5;max-width:100%}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.hidden{display:none!important}.muted{color:#64748b}.notice{font-weight:750;color:#365bd0}#clock{font-size:32px;color:#e34c63;font-weight:900}.layout{display:grid;grid-template-columns:minmax(0,3fr) minmax(220px,1.25fr);gap:16px}.avatars{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.avatar{min-width:84px;text-align:center;padding:8px;border:2px solid #dbe5f7;border-radius:14px;background:#fff;position:relative}.avatar .face{font-size:32px}.avatar .name{font-size:13px;font-weight:700}.avatar.active{border:4px solid #19bc66;background:#e5ffef;transform:scale(1.05);box-shadow:0 0 0 4px #9cf1c0}.avatar.active:before{content:'🎨 그리는 중';position:absolute;bottom:100%;left:0;white-space:nowrap;font-size:11px;color:#00884a;font-weight:800}.dot{display:inline-block;width:16px;height:16px;border-radius:50%;border:1px solid #0002;vertical-align:middle}.roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.person{padding:8px;border-radius:12px;background:#f6f9ff;border:1px solid #dbe5f7;display:flex;align-items:center;gap:7px;font-size:13px}.person.active{border:2px solid #15b65b;background:#e4ffec;font-weight:900}canvas{display:block;width:100%;height:auto;border:2px solid #c5d4ef;border-radius:15px;background:white;touch-action:none}.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.tile{padding:10px;border:1px solid #dce5f4;border-radius:12px}.tile canvas{border:0}.vote-btn{margin:4px}.big{font-size:28px;font-weight:900}.win{padding:25px;text-align:center;border-radius:20px;background:#eaf8f1}.lose{background:#fff0f2}#teacher{border-top:1px solid #dce5f4;padding-top:15px;margin-top:15px}@media(max-width:760px){.layout{grid-template-columns:1fr}.avatar{min-width:68px;padding:5px}.avatar .face{font-size:24px}.roster{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body><main><h1>🎨 그림 라이어 게임</h1><p class="muted">17명까지 함께 즐기는 실시간 그림 추리 게임</p><section id="entry" class="card"><h2>게임방 입장</h2><div class="row"><input id="roomInput" maxlength="6" placeholder="6자리 방 코드"><input id="nameInput" maxlength="25" placeholder="학생 이름"><button id="join">학생 입장</button><button id="create">교사: 게임방 만들기</button></div></section><section id="room" class="card hidden"><h2>게임방 <span id="code"></span></h2><p id="status" class="notice"></p><p>참여 학생 <b id="count">0</b> / 17</p><div id="teacher" class="hidden"><div class="row"><select id="mode"><option value="chain">이어 그리기</option><option value="solo">각자 그리기</option></select><label>1인당 시간 <select id="seconds"><option value="10">10초</option><option value="20">20초</option><option value="30">30초</option></select></label><input id="word" placeholder="제시어 입력"><button id="start">게임 시작</button><button id="next">다음 단계</button><button id="tally">투표 집계</button></div><p class="muted">이어 그리기는 설정한 시간마다 자동으로 차례가 바뀝니다. 3분 추리 후 투표가 시작됩니다.</p></div><div id="game" class="hidden"><div class="row"><b id="phase"></b><span id="clock"></span><span id="hint" class="notice"></span></div><div id="avatars" class="avatars"></div><div class="layout"><div><canvas id="board" width="900" height="540"></canvas><div id="tools" class="row" style="margin-top:10px"><span id="myColor"></span><div id="palette" class="row"><button data-color="#263450">검정</button><button data-color="#e94460">빨강</button><button data-color="#2485e8">파랑</button><button data-color="#ffffff">지우개</button></div><label>붓 굵기 <input id="size" type="range" min="2" max="28" value="6"></label></div><div id="gallery" class="gallery"></div><div id="votes"></div><div id="guessBox" class="hidden"><h3>😈 라이어의 마지막 기회!</h3><p>제시어를 정확하게 입력하면 라이어가 역전 승리합니다.</p><input id="guessInput" placeholder="제시어 정답"><button id="guessBtn">정답 제출</button></div><div id="result"></div></div><aside class="card" style="margin:0"><h3>🎨 학생별 색상</h3><div id="roster" class="roster"></div></aside></div></div></section><p class="muted">수업용 게임 · 교사는 게임방 코드를 학생에게 안내해 주세요.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://ocaxrntorjmotzxxqjta.supabase.co','sb_publishable_AHwYe9OgzUChbajp1UYjXg_auB6VP-p');const $=id=>document.getElementById(id);let code='',token='',host=false,me='',state=null,channel=null,painting=false,points=[],color='#263450',busy=false;const cv=$('board'),ctx=cv.getContext('2d');const faces=['👧🏻','👦🏻','🧒🏻','👩🏻','👨🏻','👧🏽','👦🏽','🧑🏻'];async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}async function act(action,data={}){return rpc('liar_action',{p_action:action,p_code:code,p_token:token,p_data:data})}function fail(e){alert(e.message||String(e))}async function enter(){$('entry').classList.add('hidden');$('room').classList.remove('hidden');$('code').textContent=code;$('teacher').classList.toggle('hidden',!host);channel=db.channel('draw-'+code).on('broadcast',{event:'change'},()=>refresh()).subscribe();await refresh();setInterval(refresh,1100)}async function announce(){if(channel)await channel.send({type:'broadcast',event:'change',payload:{}})}$('create').onclick=async()=>{try{const d=await rpc('liar_action',{p_action:'create'});code=d.code;token=d.token;host=true;await enter()}catch(e){fail(e)}};$('join').onclick=async()=>{try{code=$('roomInput').value.trim().toUpperCase();const name=$('nameInput').value.trim();if(!code||!name)return alert('코드와 이름을 입력하세요.');const d=await rpc('liar_join',{p_code:code,p_name:name});token=d.token;me=d.id;await enter();await announce()}catch(e){fail(e)}};$('start').onclick=async()=>{try{if(!$('word').value.trim())return alert('제시어를 입력하세요');await act('start',{mode:$('mode').value,word:$('word').value.trim(),seconds:Number($('seconds').value)});await announce();await refresh()}catch(e){fail(e)}};$('next').onclick=async()=>{try{await act('next');await announce();await refresh()}catch(e){fail(e)}};$('tally').onclick=async()=>{try{await act('tally');await announce();await refresh()}catch(e){fail(e)}};$('guessBtn').onclick=async()=>{try{await act('guess',{guess:$('guessInput').value.trim()});await announce();await refresh()}catch(e){fail(e)}};async function refresh(){if(busy)return;busy=true;try{state=await act('state');render()}catch(e){$('status').textContent='연결 오류: '+e.message}finally{busy=false}}function paint(canvas,strokes){const c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);c.fillStyle='white';c.fillRect(0,0,canvas.width,canvas.height);for(const s of strokes){const ps=s.points;if(!Array.isArray(ps)||!ps.length)continue;c.beginPath();c.lineCap='round';c.lineJoin='round';c.strokeStyle=ps[0].c||'#263450';c.lineWidth=ps[0].w||5;c.moveTo(ps[0].x,ps[0].y);for(const p of ps.slice(1))c.lineTo(p.x,p.y);if(ps.length===1)c.lineTo(ps[0].x+.1,ps[0].y+.1);c.stroke()}}function formatTime(sec){return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){if(!state)return;$('count').textContent=state.count;$('game').classList.toggle('hidden',state.phase==='lobby');$('status').textContent=({lobby:'학생들이 입장 중입니다.',draw:'🎨 그림을 그리는 중!',discuss:'🕵️ 라이어를 추리하세요!',vote:state.vote_round===2?'⚖️ 동점! 결선 재투표':'🗳️ 라이어 투표',guess:'😈 라이어의 마지막 역전 기회!',result:'🏆 최종 결과'})[state.phase]||'';if(state.phase==='lobby')return;
$('phase').textContent=state.mode==='chain'?'이어 그리기':'각자 그리기';const sec=Math.max(0,Math.ceil((new Date(state.phase==='discuss'?state.discussion_ends_at:state.turn_ends_at)-Date.now())/1000));$('clock').textContent=state.phase==='discuss'||(state.phase==='draw'&&state.mode==='chain')?formatTime(sec):'';const can=state.phase==='draw'&&!host&&state.my_turn&&(state.mode==='solo'||sec>0);$('hint').textContent=state.phase==='draw'?(host?'교사 진행 화면':can?'제시어: '+(state.word||'🤫 당신은 라이어입니다!'):'다른 학생이 그리는 중입니다.') :'';cv.style.pointerEvents=can?'auto':'none';const mine=state.players.find(p=>p.id===me);if(state.mode==='chain'&&mine)color=mine.color;$('palette').classList.toggle('hidden',state.mode==='chain');$('myColor').textContent=state.mode==='chain'?'내 배정 색상: '+(mine?.name||'교사'):'색상 선택 가능';$('myColor').style.color=mine?.color||'#263450';$('tools').classList.toggle('hidden',state.phase!=='draw');
$('avatars').replaceChildren();$('roster').replaceChildren();state.players.forEach((p,i)=>{const a=el('div','avatar'+(p.active?' active':''));a.style.borderColor=p.active?'#16b65b':p.color||'#dbe5f7';a.append(el('div','face',faces[i%faces.length]),el('div','name',p.name));const d=el('span','dot');d.style.background=p.color||'#ccc';a.append(d);$('avatars').append(a);const item=el('div','person'+(p.active?' active':''));item.append(el('span','',faces[i%faces.length]),el('span','',p.name));const dot=el('span','dot');dot.style.background=p.color||'#ccc';item.append(dot);$('roster').append(item)});$('roster').parentElement.classList.toggle('hidden',state.mode!=='chain');
const showGallery=state.mode==='solo'&&state.phase!=='draw';cv.classList.toggle('hidden',showGallery);$('gallery').classList.toggle('hidden',!showGallery);if(!painting)paint(cv,state.mode==='solo'&&state.phase==='draw'?state.strokes.filter(s=>s.player_id===me):state.strokes);if(showGallery){$('gallery').replaceChildren();state.players.forEach((p,i)=>{const box=el('div','tile');box.append(el('b','', '그림 '+(i+1)));const c=el('canvas');c.width=900;c.height=540;box.append(c);$('gallery').append(box);paint(c,state.strokes.filter(s=>s.player_id===p.id))})}
$('votes').replaceChildren();if(state.phase==='vote'){const p=el('p','',state.vote_round===2?'동점 후보만 대상으로 재투표합니다.':'라이어라고 생각하는 학생을 선택하세요.');$('votes').append(p);$('votes').append(el('p','muted','투표 완료: '+state.votes_cast+' / '+state.count));if(!host&&!state.voted)state.players.filter(x=>state.vote_round===1||state.candidates?.includes(x.id)).forEach(x=>{const b=el('button','vote-btn',x.name);b.onclick=async()=>{try{await act('vote',{target:x.id});await announce();await refresh()}catch(e){fail(e)}};$('votes').append(b)});else if(state.voted)$('votes').append(el('p','notice','투표가 저장되었습니다.'))}
$('guessBox').classList.toggle('hidden',state.phase!=='guess'||!state.is_liar);$('result').replaceChildren();if(state.phase==='guess'&&!state.is_liar)$('result').append(el('p','big','라이어가 제시어를 맞히는 중입니다…'));if(state.phase==='result'){const liar=state.players.find(p=>p.id===state.liar);const box=el('div','win'+(state.winner==='liar'?' lose':''));box.append(el('div','big',state.winner==='liar'?'😈 라이어의 승리!':'🎉 시민들의 승리!'),el('p','','라이어: '+(liar?.name||'확인 중')),el('p','','정답 제시어: '+(state.word||'')));$('result').append(box)}$('next').disabled=!(state.phase==='discuss'||(state.phase==='draw'&&state.mode==='solo'));$('tally').disabled=state.phase!=='vote';}
function position(e){const r=cv.getBoundingClientRect();return{x:Math.round((e.clientX-r.left)*cv.width/r.width),y:Math.round((e.clientY-r.top)*cv.height/r.height),c:color,w:Number($('size').value)}}cv.onpointerdown=e=>{if(cv.style.pointerEvents==='none')return;e.preventDefault();painting=true;points=[position(e)];cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!painting)return;e.preventDefault();const p=position(e),a=points[points.length-1];points.push(p);ctx.beginPath();ctx.lineCap='round';ctx.strokeStyle=color;ctx.lineWidth=p.w;ctx.moveTo(a.x,a.y);ctx.lineTo(p.x,p.y);ctx.stroke()};cv.onpointerup=async()=>{if(!painting)return;painting=false;if(points.length===1)points.push({...points[0],x:points[0].x+.1});try{for(let i=0;i<points.length;i+=190)await act('stroke',{points:points.slice(i,i+190)});await announce()}catch(e){fail(e)}points=[]};document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{if(state?.mode!=='chain')color=b.dataset.color});
</script></body></html>
